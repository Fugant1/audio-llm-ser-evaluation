matrix:

  main:
    datasets:
      - meld
      - iemocap

    models:
      - whisper_mistral
      - audio_flamingo
      - qwen_omni

    prompts:
      - zero-shot
      - cot
      - multi-turn
  cot-json:
    datasets:
      - meld
      - iemocap

    models:
      - whisper_mistral
      - audio_flamingo
      - qwen_omni

    prompts:
      - cot-json

  quantization:
    datasets:
      - meld
      - iemocap

    models:
      - audio_flamingo

    prompts:
      - zero-shot
      - cot
      - multi-turn

    quantization:
      - nf4
      - bf16

  fine-tuning:
    datasets:
      - meld

    models:
      - audio_flamingo

    prompts:
      - zero-shot

    training:
      enabled: true
      method: lora
      lora_r: 16
      lora_alpha: 32
      learning_rate: 0.0002
      batch_size: 4
      epochs: 5